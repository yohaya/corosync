name: Build and Release Debian Packages

# Every push to stability-fixes creates/updates a rolling "latest" pre-release
# with ready-to-install .deb files.  Pushing a version tag (v*) creates a
# permanent, versioned release.
on:
  push:
    branches: [ stability-fixes ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ stability-fixes ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.1.10-pve1) — leave blank for rolling latest'
        required: false

permissions:
  contents: write   # needed to create/update releases and upload assets

# Cancel in-progress runs on the same branch to avoid duplicate releases
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Matrix build: one job per target Debian/Proxmox release
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Proxmox VE 8 — Debian 12 (bookworm)
          - debian_release: bookworm
            label:          "Proxmox 8 / Debian 12"
            pkg_distro:     bookworm
            pkg_epoch:      pve8

          # Proxmox VE 9 — Debian 13 (trixie)
          - debian_release: trixie
            label:          "Proxmox 9 / Debian 13"
            pkg_distro:     trixie
            pkg_epoch:      pve9

    container:
      image: debian:${{ matrix.debian_release }}

    steps:
      # ---- install deps before checkout so git is available ----
      - name: Install build dependencies
        run: |
          set -e
          DISTRO="${{ matrix.debian_release }}"

          # Bootstrap: need wget/ca-certificates/gpg to fetch the Proxmox repo key
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wget ca-certificates gnupg

          # Import the Proxmox release signing key so apt trusts the PVE repo.
          # libknet1-dev (kronosnet) and matching libqb-dev are only in the PVE repo,
          # not in standard Debian repos.
          wget -qO /tmp/proxmox-release.gpg \
            "https://enterprise.proxmox.com/debian/proxmox-release-${DISTRO}.gpg"
          # The key file may be armored (ASCII) or binary; handle both.
          if gpg --dearmor < /tmp/proxmox-release.gpg \
               > /etc/apt/trusted.gpg.d/proxmox-release-${DISTRO}.gpg 2>/dev/null; then
            echo "Imported Proxmox GPG key (armored format)"
          else
            cp /tmp/proxmox-release.gpg /etc/apt/trusted.gpg.d/proxmox-release-${DISTRO}.gpg
            echo "Imported Proxmox GPG key (binary format)"
          fi

          # Add pve-no-subscription AND pvetest repos for maximum package coverage
          echo "deb http://download.proxmox.com/debian/pve ${DISTRO} pve-no-subscription" \
            > /etc/apt/sources.list.d/pve.list
          echo "deb http://download.proxmox.com/debian/pvetest ${DISTRO} pvetest" \
            >> /etc/apt/sources.list.d/pve.list
          apt-get update -qq --allow-insecure-repositories 2>&1 | tail -5 || apt-get update -qq

          # In the Proxmox PVE repo the dev package is named libknet-dev (no soversion
          # suffix), while the runtime is libknet1.  Try both names for compatibility.
          KNET_DEV=$(apt-cache show libknet-dev 2>/dev/null | head -1 | grep -q Package \
                     && echo libknet-dev || echo libknet1-dev)
          echo "Using knet dev package: ${KNET_DEV}"

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            --allow-unauthenticated \
            git \
            build-essential \
            devscripts \
            debhelper \
            dh-exec \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libqb-dev \
            "${KNET_DEV}" \
            zlib1g-dev \
            libsystemd-dev \
            groff \
            docbook2x \
            libxml2-utils \
            xsltproc \
            lsb-release
          dpkg -l libqb-dev "${KNET_DEV}" | tail -3
          # Allow git to work in the workspace dir regardless of file ownership
          # (the runner user and container user may have different UIDs)
          git config --global --add safe.directory '*'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- derive version strings ----
      - name: Compute package version
        id: pkgver
        shell: bash
        run: |
          set -e
          BASE="3.1.10"
          EPOCH="${{ matrix.pkg_epoch }}"
          DISTRO="${{ matrix.pkg_distro }}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            PKG_VER="${TAG}-${EPOCH}1"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            SHORT=$(git rev-parse --short HEAD)
            PKG_VER="${BASE}+git${SHORT}-${EPOCH}1"
          else
            PKG_VER="${BASE}-${EPOCH}1"
          fi

          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "pkg_ver=${PKG_VER}"        >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}"  >> "$GITHUB_OUTPUT"
          echo "Building package version: ${PKG_VER} for ${DISTRO}"

      # ---- patch changelog to embed correct version + distro ----
      - name: Update debian/changelog
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import sys

          with open("debian/changelog") as f:
              content = f.read()

          import subprocess, datetime
          pkg_ver = "${{ steps.pkgver.outputs.pkg_ver }}"
          distro  = "${{ matrix.pkg_distro }}"
          label   = "${{ matrix.label }}"
          date    = subprocess.check_output(["date", "-R"]).decode().strip()
          short   = subprocess.check_output(
              ["git", "rev-parse", "--short", "HEAD"],
              stderr=subprocess.DEVNULL
          ).decode().strip()

          new_header = (
              f"corosync ({pkg_ver}) {distro}; urgency=medium\n\n"
              f"  * Automated build for {label}\n"
              f"  * Commit: {short}\n\n"
              f" -- Corosync Stability Fork <users@clusterlabs.org>  {date}\n\n"
          )

          with open("debian/changelog", "w") as f:
              f.write(new_header + content)
          PYEOF
          echo "--- debian/changelog head ---"
          head -8 debian/changelog

      # ---- generate configure script ----
      - name: Run autogen
        run: ./autogen.sh

      # ---- build the Debian binary packages ----
      - name: Build Debian packages
        run: dpkg-buildpackage -b -uc -us -j$(nproc)

      # ---- collect .deb files and rename to include distro ----
      - name: Collect and rename packages
        id: collect
        shell: bash
        run: |
          set -e
          DISTRO="${{ matrix.pkg_distro }}"
          mkdir -p dist

          for deb in ../*.deb; do
            [ -f "$deb" ] || continue
            base=$(basename "$deb" .deb)
            dest="dist/${base}.${DISTRO}.deb"
            mv "$deb" "$dest"
            echo "  $dest"
          done

          for f in ../*.buildinfo ../*.changes; do
            [ -f "$f" ] && cp "$f" dist/ || true
          done

          ls -lh dist/

      # ---- upload per-matrix artifacts ----
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.pkg_epoch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90

  # -----------------------------------------------------------------------
  # Release: publish to GitHub Releases
  #
  # Branch push  → updates the rolling "latest" pre-release (always current)
  # Tag push     → creates a permanent versioned release
  # workflow_dispatch → same as branch push unless a tag input is given
  #
  # NOT run on pull_request events (no write permission for forks).
  # -----------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -name '*.deb' | sort

      # Decide tag name, release name, and prerelease flag
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Versioned release
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}"                                         >> "$GITHUB_OUTPUT"
            echo "name=Corosync Stability Fork ${TAG}"                >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                    >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # Manual dispatch with explicit tag
            TAG="${{ github.event.inputs.tag }}"
            echo "tag=${TAG}"                                         >> "$GITHUB_OUTPUT"
            echo "name=Corosync Stability Fork ${TAG}"                >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                    >> "$GITHUB_OUTPUT"
          else
            # Rolling latest — always updates the same pre-release entry
            echo "tag=latest"                                         >> "$GITHUB_OUTPUT"
            echo "name=Corosync Stability Fork — latest (${DATE} ${SHORT})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                     >> "$GITHUB_OUTPUT"
          fi

      # For the rolling "latest" tag we must move the lightweight git tag
      # before softprops can update the release.  Versioned tags already
      # exist and must not be force-moved.
      - name: Move 'latest' git tag to current commit
        if: steps.meta.outputs.tag == 'latest'
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git tag -f latest
          git push origin --force refs/tags/latest

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ steps.meta.outputs.tag }}
          name:                 ${{ steps.meta.outputs.name }}
          prerelease:           ${{ steps.meta.outputs.prerelease }}
          files:                release-assets/*.deb
          fail_on_unmatched_files: false
          body: |
            ## ${{ steps.meta.outputs.name }}

            Based on upstream corosync **v3.1.10** with stability, memory, and
            scalability fixes for large-scale Proxmox VE clusters (50+ nodes).

            > **Pre-release** builds are updated on every commit to `stability-fixes`.
            > For production use, pin to a versioned tag (e.g. `v3.1.10-pve1`).

            ---

            ### Quick install

            #### Proxmox VE 8 (Debian 12 bookworm)
            ```bash
            TAG=${{ steps.meta.outputs.tag }}
            BASE=https://github.com/${{ github.repository }}/releases/download/${TAG}

            wget "${BASE}/corosync_$(dpkg --print-architecture).bookworm.deb" 2>/dev/null || \
              wget "${BASE}/$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} \
                | grep -o '"name": "[^"]*bookworm[^"]*corosync_[^"]*"' | head -1 | cut -d'"' -f4)"

            # Simpler: just download all bookworm debs
            curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} \
              | grep browser_download_url | grep bookworm | cut -d'"' -f4 | xargs wget

            systemctl stop corosync corosync-qdevice 2>/dev/null; true
            dpkg -i libcorosync-common4_*.bookworm.deb corosync_*.bookworm.deb corosync-qdevice_*.bookworm.deb
            apt-get install -f
            systemctl start corosync
            ```

            #### Proxmox VE 9 (Debian 13 trixie)
            ```bash
            # Same as above but replace "bookworm" with "trixie"
            ```

            ---

            ### Fixes included

            | Severity | Bug | File | Impact |
            |----------|-----|------|--------|
            | **CRITICAL** | FCC flow-control unsigned underflow | `totemsrp.c` | Burst past window_size → queue saturation |
            | **CRITICAL** | 13 `assert()` crash points → graceful log | `totemsrp.c` | Daemon restart storm on CPG failure |
            | **CRITICAL** | `retrans_message_queue` drain leak | `totemsrp.c` | ~1 GB leaked per ring-recovery event |
            | **CRITICAL** | `assembly_list_free` unbounded growth | `totempg.c` | **15+ GiB RSS** on 53-node cluster |
            | **CRITICAL** | `token_convert` buffer too small for 256 RTR entries | `totemsrp.c` | Stack overflow on endian conversion |
            | HIGH | `check_memb_commit_token_sanity` wrong return on short msg | `totemsrp.c` | Truncated commit token processed as valid |
            | HIGH | `qdevice` NULL dereference (3 sites) | `votequorum.c` | Crash during qdevice init/reinit |
            | HIGH | `RETRANSMIT_ENTRIES_MAX=30` → RTR starvation at N>30 | `totemsrp.c` | O(N/30) delivery latency growth |
            | HIGH | `WINDOW_SIZE=50` → FCC deadlock at 300 nodes | `totemconfig.c` | Ring effectively dead at scale |
            | HIGH | `alloca()` → `malloc()` (3 sites) | `cpg.c` | Stack overflow with 100+ members |
            | MEDIUM | Dynamic RTR sizing: `retransmit_entries_max` per ring | `totemsrp.c` | 1 RTR slot per member, not hardcoded |
            | MEDIUM | DIAG scalability warning when `window_size` too small | `totemsrp.c` | Operators notified before FCC throttle |
            | MEDIUM | `logsys_config_mode_get` unsigned→int return | `logsys.c` | Silent error bypass in log config |
            | LOW | Dead write before if/else | `totemudp.c` | Static analysis noise |
            | INFO | 6 DIAG runtime probes | `totemsrp.c` | Token timing, ARU stall, queue pressure |
